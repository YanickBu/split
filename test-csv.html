<!DOCTYPE html>
<html>
<head><title>Test CSV Import</title></head>
<body>
<button onclick="document.getElementById('importFile').click()">Import CSV</button>
<input type="file" id="importFile" accept=".csv" style="display:none" onchange="handleFile(event)">
<div id="output"></div>
<script>
  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      document.getElementById('output').innerText = "File loaded. Length: " + reader.result.length;
    };
    reader.readAsText(file);
  }
</script>
</body>
</html>
